version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mundial_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: mundial_2026
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: secretpassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: